            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

            border: 2px solid #38bdf8;

            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);

        }

        @keyframes runningLED {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes fireFlicker {
            0% {
                text-shadow: 
                    0 -2px 4px rgba(255, 80, 0, 0.6), 
                    0 -4px 10px rgba(255, 150, 0, 0.4), 
                    0 -10px 20px rgba(255, 200, 0, 0.2),

        @keyframes fall {

            text-align: center;

            background: #020617;

            font-size: 13px;
