<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ADMIN OVERRIDE PANEL ⚡</title>
    <link rel="stylesheet" href="usb.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-section { margin-top: 30px; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        #login-panel { max-width: 400px; margin: 80px auto; display: block; }
        #main-content { display: none; }
        @media (max-width: 768px) { .input-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ ADMIN OVERRIDE PANEL: DATABASE MANAGER ⚡</h1>
        <p>[ System Terminal Status: SECURED BY ENCRYPTION LAYER ]</p>
    </header>

    <!-- INTERFACE 01: PANEL LOGIN ADMIN -->
    <div id="login-panel">
        <div class="card">
            <h3>[⚙] ADMIN SECURITY CHECK</h3>
            <div class="form-group" style="margin-bottom: 15px;">
                <label>// ENTER MASTER PASSWORD</label>
                <input type="password" id="admin-password" class="form-control" placeholder="ENTER SECRET PASSWORD...">
            </div>
            <button class="btn btn-check" onclick="loginAdmin()" style="width: 100%;">[▶] DECRYPT ACCESS</button>
        </div>
    </div>

    <!-- INTERFACE 02: KONTEN UTAMA -->
    <div id="main-content">
        <div class="card">
            <h3>[+] ADD NEW TECHNICIAN NODE</h3>
            <div class="input-grid">
                <div class="form-group">
                    <label>// TOKEN KEY</label>
                    <input type="text" id="new-token" class="form-control" placeholder="Contoh: TOK-2026-XYZ">
                </div>
                <div class="form-group">
                    <label>// TECHNICIAN IP</label>
                    <input type="text" id="new-ip" class="form-control" placeholder="Contoh: 123.45.67.89">
                </div>
                <div class="form-group">
                    <label>// PORT NUMBER</label>
                    <input type="number" id="new-port" class="form-control" placeholder="Contoh: 32032">
                </div>
            </div>
            <button class="btn" onclick="tambahToken()">[+] INJECT NEW NODE</button>
        </div>

        <div class="card admin-section">
            <h3>[=] ACTIVE NODE CONFIGURATIONS</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>TOKEN KEY</th>
                            <th>TECHNICIAN IP</th>
                            <th>PORT</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="token-table-body">
                        <!-- Data Token Load Disini -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="admin.js?v=6"></script>
</body>
</html>
