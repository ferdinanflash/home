<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ADMIN OVERRIDE PANEL ⚡</title>
    <link rel="stylesheet" href="usb.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-section { margin-top: 30px; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .port-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 15px; }
        .main-admin-layout { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
        @media (max-width: 950px) { .main-admin-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ ADMIN OVERRIDE PANEL: DATABASE MANAGER ⚡</h1>
        <p>[ System Terminal Status: MASTER ACCESS ]</p>
    </header>

    <div class="main-admin-layout">
        
        <!-- KOLOM KIRI: KELOLA TOKEN & IP -->
        <div>
            <div class="card">
                <h3>[+] ADD NEW TECHNICIAN TOKEN</h3>
                <div class="input-grid">
                    <div class="form-group">
                        <label>// TOKEN KEY</label>
                        <input type="text" id="new-token" class="form-control" placeholder="Contoh: TOK-2026-XYZ">
                    </div>
                    <div class="form-group">
                        <label>// TECHNICIAN IP</label>
                        <input type="text" id="new-ip" class="form-control" placeholder="Contoh: 123.45.67.89">
                    </div>
                </div>
                <button class="btn" onclick="tambahToken()">[+] INJECT NEW TOKEN</button>
            </div>

            <div class="card admin-section">
                <h3>[=] ACTIVE TOKEN LIST</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>TOKEN KEY</th>
                                <th>TECHNICIAN IP</th>
                                <th>ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="token-table-body">
                            <!-- Data Token Load Disini -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- KOLOM KANAN: KELOLA PORT -->
        <div>
            <div class="card">
                <h3>[⚙] REMOTE PORT CONFIG (usb_remote)</h3>
                <div class="port-grid">
                    <div class="form-group">
                        <label>// CURRENT PORT NUMBER</label>
                        <input type="number" id="current-port-value" class="form-control" placeholder="Loading port...">
                    </div>
                </div>
                <button class="btn btn-check" onclick="updatePort()">[⚡] UPDATE PORT VALUE</button>
            </div>
        </div>

    </div>
</div>

<script src="admin.js?v=5"></script>
</body>
</html>
