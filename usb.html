<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web ADB</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #0b0f17;
        }
    </style>
</head>
<body class="text-gray-200 font-sans min-h-screen p-6 flex justify-center items-start">

    <div class="w-full max-w-md bg-[#111622] border border-gray-800 rounded-2xl shadow-xl overflow-hidden p-6 space-y-6">
        
        <div class="bg-[#171e2e] border border-gray-800/60 rounded-xl p-4 flex flex-col items-start space-y-3">
            <div id="status-container" class="flex items-center space-x-2 text-sm text-gray-400">
                <span id="status-dot" class="w-2.5 h-2.5 bg-gray-600 rounded-full inline-block"></span>
                <span id="status-text" class="font-medium tracking-wide">No device connected</span>
            </div>
            
            <button id="btn-connect" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200 flex items-center justify-center space-x-2 text-sm shadow-md cursor-pointer">
                <span>➔ Connect ADB</span>
            </button>
        </div>

        <div class="space-y-3">
            <h3 class="text-xs font-semibold text-blue-400 uppercase tracking-wider flex items-center gap-1.5">
                📄 Read Info
            </h3>
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-[#171e2e]/60 p-3 rounded-xl border border-gray-800/80">
                    <label class="text-[10px] text-gray-500 block font-semibold tracking-wider">CODENAME</label>
                    <span id="info-codename" class="text-xs font-mono font-bold text-gray-400">-</span>
                </div>
                <div class="bg-[#171e2e]/60 p-3 rounded-xl border border-gray-800/80">
                    <label class="text-[10px] text-gray-500 block font-semibold tracking-wider">BRAND / MODEL</label>
                    <span id="info-model" class="text-xs font-mono font-bold text-gray-400">-</span>
                </div>
                <div class="bg-[#171e2e]/60 p-3 rounded-xl border border-gray-800/80">
                    <label class="text-[10px] text-gray-500 block font-semibold tracking-wider">REGION</label>
                    <span id="info-region" class="text-xs font-mono font-bold text-gray-400">-</span>
                </div>
                <div class="bg-[#171e2e]/60 p-3 rounded-xl border border-gray-800/80">
                    <label class="text-[10px] text-gray-500 block font-semibold tracking-wider">VERSI ANDROID</label>
                    <span id="info-version" class="text-xs font-mono font-bold text-gray-400">-</span>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <button id="btn-read-info" disabled class="bg-[#1c2438] hover:bg-[#242f49] text-gray-300 disabled:opacity-30 disabled:hover:bg-[#1c2438] font-medium py-2 rounded-lg text-xs transition border border-gray-700/40 cursor-pointer disabled:cursor-not-allowed">
                    📄 Read Info
                </button>
                <button id="btn-reboot" disabled class="bg-[#1c2438] hover:bg-[#242f49] text-gray-300 disabled:opacity-30 disabled:hover:bg-[#1c2438] font-medium py-2 rounded-lg text-xs transition border border-gray-700/40 cursor-pointer disabled:cursor-not-allowed">
                    🔄 Reboot
                </button>
            </div>
        </div>

        <div class="space-y-1.5 border-t border-gray-800/60 pt-4">
            <label class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider">Log Konsol</label>
            <div id="log-output" class="w-full h-24 bg-black/40 border border-gray-900 rounded-lg p-2 font-mono text-[11px] text-green-400 overflow-y-auto whitespace-pre-wrap">Sistem siap... Silakan klik "Connect ADB".</div>
        </div>

    </div>

    <script type="module">
        import { AdbWebUsbBackend } from 'https://unpkg.com/@yume-chan/adb-backend-webusb@0.0.23/dist/index.js';
        import { Adb, AdbWebCredentialStore } from 'https://unpkg.com/@yume-chan/adb@0.0.23/dist/index.js';

        const CredentialStore = new AdbWebCredentialStore('web-adb-panel-v2');
        let currentAdbInstance = null;

        // Elemen UI
        const btnConnect = document.getElementById('btn-connect');
        const btnReadInfo = document.getElementById('btn-read-info');
        const btnReboot = document.getElementById('btn-reboot');
        
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const logOutput = document.getElementById('log-output');

        function writeLog(text) {
            logOutput.innerText += `\n> ${text}`;
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        // Fungsi sinkronisasi status UI berdasarkan koneksi perangkat
        function updateUIConnected(isConnected, deviceName = "") {
            if (isConnected) {
                statusDot.className = "w-2.5 h-2.5 bg-green-500 rounded-full inline-block animate-pulse";
                statusText.innerText = `Connected: ${deviceName}`;
                statusText.classList.replace('text-gray-400', 'text-green-400');
                
                btnReadInfo.removeAttribute('disabled');
                btnReboot.removeAttribute('disabled');
                
                btnConnect.innerHTML = '<span>➔ Disconnect Device</span>';
                btnConnect.classList.replace('bg-blue-600', 'bg-red-600/80');
                btnConnect.classList.replace('hover:bg-blue-700', 'hover:bg-red-700');
            } else {
                statusDot.className = "w-2.5 h-2.5 bg-gray-600 rounded-full inline-block";
                statusText.innerText = 'No device connected';
                statusText.classList.replace('text-green-400', 'text-gray-400');
                
                btnReadInfo.setAttribute('disabled', 'true');
                btnReboot.setAttribute('disabled', 'true');
                
                btnConnect.innerHTML = '<span>➔ Connect ADB</span>';
                btnConnect.classList.replace('bg-red-600/80', 'bg-blue-600');
                btnConnect.classList.replace('hover:bg-red-700', 'hover:bg-blue-700');
                
                // Kosongkan info tabel
                document.getElementById('info-codename').innerText = '-';
                document.getElementById('info-model').innerText = '-';
                document.getElementById('info-region').innerText = '-';
                document.getElementById('info-version').innerText = '-';
            }
        }

        // Logika saat tombol Connect ADB diklik
        btnConnect.addEventListener('click', async () => {
            if (currentAdbInstance) {
                currentAdbInstance = null;
                updateUIConnected(false);
                writeLog("Koneksi diputus oleh pengguna.");
                return;
            }

            try {
                writeLog("Membuka pilihan device USB browser...");
                
                // Baris ini yang memicu browser memunculkan daftar pilihan Device
                const backend = await AdbWebUsbBackend.requestDevice();
                if (!backend) {
                    writeLog("Pemilihan device dibatalkan.");
                    return;
                }

                writeLog(`Menghubungkan fisik USB: ${backend.serialNumber || 'Android'}`);
                await backend.connect();

                writeLog("Mengirim kunci autentikasi RSA ke HP... (Cek layar HP Anda dan pilih Izinkan/Allow)");
                
                const adb = await Adb.authenticate({
                    backend,
                    credentialStore: CredentialStore,
                });

                currentAdbInstance = adb;
                updateUIConnected(true, backend.serialNumber || "Android Device");
                writeLog("Device Terhubung & Terotorisasi!");
                
                // Otomatis read info setelah sukses connect
                readDeviceInformation();

            } catch (err) {
                writeLog(`Gagal terhubung: ${err.message}`);
                console.error(err);
                updateUIConnected(false);
            }
        });

        // Logika fungsi mengambil informasi device internal (getprop)
        async function readDeviceInformation() {
            if (!currentAdbInstance) return;
            try {
                writeLog("Mengambil data properti internal device...");
                
                const codename = await currentAdbInstance.getprop("ro.product.name");
                const brand = await currentAdbInstance.getprop("ro.product.brand");
                const model = await currentAdbInstance.getprop("ro.product.model");
                const version = await currentAdbInstance.getprop("ro.build.version.release");
                let region = await currentAdbInstance.getprop("ro.miui.region");
                if(!region) region = await currentAdbInstance.getprop("ro.product.locale.region");

                document.getElementById('info-codename').innerText = codename.toUpperCase();
                document.getElementById('info-model').innerText = `${brand.toUpperCase()} ${model}`;
                document.getElementById('info-region').innerText = region ? region.toUpperCase() : "UNKNOWN";
                document.getElementById('info-version').innerText = `Android ${version}`;

                writeLog("Proses Read Info Selesai.");
            } catch (err) {
                writeLog(`Gagal Read Info: ${err.message}`);
            }
        }

        btnReadInfo.addEventListener('click', readDeviceInformation);

        btnReboot.addEventListener('click', async () => {
            if (!currentAdbInstance) return;
            try {
                writeLog("Mengirim perintah: adb reboot");
                await currentAdbInstance.reboot();
                writeLog("Perintah reboot berhasil dikirim.");
            } catch (err) {
                writeLog(`Gagal reboot: ${err.message}`);
            }
        });
    </script>
</body>
</html>
